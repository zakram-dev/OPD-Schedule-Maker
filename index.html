<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15171c" />
    <meta name="color-scheme" content="light" />
    <script>
      // Apply the saved theme before the page paints (light is the default).
      (function () {
        var t = 'light';
        try { t = localStorage.getItem('opd-schedule-maker:theme') || 'light'; } catch (e) {}
        if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <title>OPD Schedule Maker</title>
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-ogp-48x48.png" />
    <link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip no-print" href="#app">Skip to content</a>

    <!-- Icon set (stroke icons on a 24px grid). Used as <svg><use href="#i-name"/></svg>. -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3" /><path d="m7 8 5-5 5 5" /><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" /></symbol>
      <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><path d="M9 12h6" /><path d="M9 16h4" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" /></symbol>
      <symbol id="i-gantt" viewBox="0 0 24 24"><path d="M3 3v18h18" /><path d="M7 7h7" /><path d="M10 12h9" /><path d="M7 17h6" /></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></symbol>
      <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V2h12v7" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" rx="1" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M5 21h14" /></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8" /><path d="M21 3v5h-5" /></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5" /><path d="M4 20 21 3" /><path d="M21 16v5h-5" /><path d="m15 15 6 6" /><path d="m4 4 5 5" /></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><path d="m9 12 2 2 4-4" /></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14" /><path d="M5 12h14" /></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14" /><path d="m13 6 6 6-6 6" /></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M11 5h10" /><path d="M11 10h7" /><path d="M11 15h4" /><path d="m3 17 3 3 3-3" /><path d="M6 19V4" /></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7" /><path d="M4 10V3" /><path d="M12 21v-9" /><path d="M12 8V3" /><path d="M20 21v-5" /><path d="M20 12V3" /><path d="M1 14h6" /><path d="M9 8h6" /><path d="M17 16h6" /></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="5" rx="1" /><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8" /><path d="M10 12h4" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" /><path d="M12 9v4" /><path d="M12 17h.01" /></symbol>
      <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="m8 12 3 3 5-6" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18" /><path d="M8 6V4h8v2" /><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21" /></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5" /></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4" /><path d="M8 2v4" /><path d="M3 10h18" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.9 4.9 1.4 1.4" /><path d="m17.7 17.7 1.4 1.4" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.3 17.7-1.4 1.4" /><path d="m19.1 4.9-1.4 1.4" /></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" /><path d="M8 21h8" /><path d="M12 17v4" /></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></symbol>
    </svg>

    <header class="topbar no-print">
      <div class="topbar-in">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="7" fill="#FFC933" />
            <rect x="6" y="8" width="14" height="4" rx="2" fill="#15171C" />
            <rect x="6" y="14.5" width="6" height="4" rx="2" fill="#15171C" />
            <rect x="17" y="14.5" width="9" height="4" rx="2" fill="#15171C" />
            <rect x="12" y="21" width="14" height="4" rx="2" fill="#15171C" opacity=".5" />
          </svg>
          <div class="brand-text">
            <span class="brand-name">OPD Schedule Maker</span>
            <span class="brand-sub">Jobs &amp; lunches, planned in a minute</span>
          </div>
        </div>

        <div class="daynav" role="group" aria-label="Choose the day">
          <button class="daynav-btn" id="dayPrev" type="button" aria-label="Previous day">
            <svg class="ic" aria-hidden="true"><use href="#i-chevron-left" /></svg>
          </button>
          <label class="daynav-date">
            <span class="sr-only">Day</span>
            <input type="date" id="date" />
          </label>
          <button class="daynav-btn" id="dayNext" type="button" aria-label="Next day">
            <svg class="ic" aria-hidden="true"><use href="#i-chevron-right" /></svg>
          </button>
          <button class="daynav-today" id="dayToday" type="button">Today</button>
        </div>

        <div class="top-actions">
          <button class="btn on-dark" id="btnHistory" type="button">
            <svg class="ic" aria-hidden="true"><use href="#i-archive" /></svg><span class="lbl">Saved days</span>
          </button>
          <button class="btn on-dark" id="btnSettings" type="button">
            <svg class="ic" aria-hidden="true"><use href="#i-sliders" /></svg><span class="lbl">Settings</span>
          </button>
        </div>
      </div>
    </header>

    <nav class="steps no-print" id="steps" aria-label="Steps">
      <div class="steps-in">
        <button type="button" data-step="import">
          <span class="step-n" aria-hidden="true"><b>1</b><svg class="ic"><use href="#i-check" /></svg></span>
          <span class="step-l">Add<span class="long"> schedule</span></span>
        </button>
        <button type="button" data-step="review">
          <span class="step-n" aria-hidden="true"><b>2</b><svg class="ic"><use href="#i-check" /></svg></span>
          <span class="step-l">Check<span class="long"> people</span></span>
        </button>
        <button type="button" data-step="schedule">
          <span class="step-n" aria-hidden="true"><b>3</b><svg class="ic"><use href="#i-check" /></svg></span>
          <span class="step-l">Jobs<span class="long"> &amp; lunches</span></span>
        </button>
      </div>
    </nav>

    <main id="app" class="no-print" tabindex="-1"></main>

    <dialog id="settingsDlg" class="dlg" aria-labelledby="settingsTitle"></dialog>
    <dialog id="historyDlg" class="dlg" aria-labelledby="historyTitle"></dialog>
    <div id="toast" class="toast no-print" role="status" aria-live="polite"></div>
    <div id="printArea" class="print-only"></div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
    <script src="js/time.js"></script>
    <script src="js/scheduler.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/storage.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
    <script src="js/ocr.js"></script>
    <script src="js/sheet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js" defer></script>
    <script src="js/pdf.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
